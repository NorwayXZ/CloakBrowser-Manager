name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: python -m pip install -r backend/requirements.txt pytest pytest-asyncio
      - run: python -m pytest backend/tests -q
      - uses: actions/setup-node@v7
        if: matrix.os == 'ubuntu-latest'
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Panel API types match the backend
        if: matrix.os == 'ubuntu-latest'
        run: |
          python scripts/export_openapi.py build/openapi.json
          cd frontend
          npm ci
          npm run gen:api
          git diff --exit-code src/next/shared/api/schema.d.ts || {
            echo "::error::frontend/src/next/shared/api/schema.d.ts is stale: run scripts/export_openapi.py build/openapi.json, then npm run gen:api in frontend/"
            exit 1
          }
      - name: Native runtime smoke
        if: matrix.os != 'ubuntu-latest'
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python scripts/native_runtime_smoke.py

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm test -- --run
      - run: npm run build
      - run: npm run size
