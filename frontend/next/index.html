<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <title>CloakBrowser Manager</title>
    <script>
      // Apply the last theme before the bundle loads so a dark panel never
      // flashes white. The backend preference is authoritative; this is a cache.
      (function () {
        var theme = "system";
        try { theme = localStorage.getItem("cbm.theme") || "system"; } catch (e) {}
        var dark = theme === "dark" || (theme === "system" && window.matchMedia("(prefers-color-scheme: dark)").matches);
        document.documentElement.dataset.theme = dark ? "dark" : "light";
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/next/main.tsx"></script>
  </body>
</html>
